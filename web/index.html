<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axaliai — All Social</title><style>
*{box-sizing:border-box}body{margin:0;background:#07080c;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}h1{margin:0;font-size:32px}.sub{color:#9aa3b2;margin:8px 0 24px}.search{width:100%;padding:15px 17px;border:1px solid #272c36;border-radius:16px;background:#11141b;color:white;font-size:16px;outline:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:18px}.card{border:1px solid #252a34;background:#10131a;border-radius:18px;padding:20px;min-height:125px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#687386}.icon{font-size:28px}.name{font-weight:700;margin-top:12px}.status{font-size:12px;color:#8f99a8;margin-top:5px}.command{margin-top:22px;padding:18px;border:1px solid #252a34;border-radius:18px;background:#0d1016}.command button{margin-top:12px;padding:11px 15px;border:0;border-radius:12px;background:#f5f7fb;color:#08090c;font-weight:700}.result{color:#b8c0cc;margin-top:12px;min-height:22px}</style></head>
<body><main><h1>Axaliai</h1><div class="sub">The DNA of AI · All Social gateway</div><input id="q" class="search" placeholder="Ask Axaliai or find a social platform…"><section id="grid" class="grid"></section><div class="command"><strong>Universal command</strong><div class="result" id="result">Choose a platform or ask Axaliai what you want to do.</div><button id="ask">Run command</button></div></main>
<script>
const apps=[['◎','Instagram'],['f','Facebook'],['♪','TikTok'],['▶','YouTube'],['𝕏','X'],['in','LinkedIn'],['@','Threads'],['R','Reddit'],['P','Pinterest'],['◉','WhatsApp'],['✈','Telegram'],['♫','Spotify']];
const grid=document.getElementById('grid'),q=document.getElementById('q'),result=document.getElementById('result');
function render(){const s=q.value.toLowerCase();grid.innerHTML=apps.filter(a=>a[1].toLowerCase().includes(s)).map(a=>`<div class="card" data-name="${a[1]}"><div class="icon">${a[0]}</div><div class="name">${a[1]}</div><div class="status">Open / connect</div></div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{result.textContent='Selected '+c.dataset.name+'. Authorization will be required before account actions.'})}q.oninput=render;document.getElementById('ask').onclick=()=>{result.textContent=q.value?'Axaliai command: '+q.value:'Select a platform or enter a command.'};render();
</script></body></html>
