name: Axaliai Mainnet Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE: axaliai-mainnet
  NETWORK: xparallel-mainnet

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: axaliai-mainnet
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mainnet workflow is intentionally scoped to main; Android feature branches
      # must use the dedicated AXALIAI Android v1 workflow.
      - name: Validate deployment manifest
        run: |
          test -f deployment/mainnet.yaml
          test -f deployment/history.json
          test -f xparallel/server.py

      - name: Trigger Render deployment
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"

      - name: Deployment metadata
        run: |
          echo "service=$SERVICE"
          echo "network=$NETWORK"
          echo "commit=${GITHUB_SHA}"
          echo "url=https://axaliai.com/"
          echo "GitHub environment deployment history is authoritative for CI/CD events."
          echo "On-chain anchoring requires an explicitly selected blockchain and deployed registry contract."
