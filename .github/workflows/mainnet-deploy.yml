name: Axaliai Mainnet Deploy

on:
  push:
    branches:
      - main
      - axaliai-mainnet-deployment
    paths:
      - 'xparallel/**'
      - 'axaliai/**'
      - 'tests/**'
      - 'web/**'
      - 'deployment/**'
      - 'render.yaml'
      - 'vercel.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  SERVICE: axaliai-mainnet
  NETWORK: xparallel-mainnet

jobs:
  verify:
    name: Verify Axaliai
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository manifests
        run: |
          test -f deployment/mainnet.yaml
          test -f deployment/history.json
          test -f xparallel/server.py
          test -f web/index.html
          test -f vercel.json
          python -m py_compile xparallel/*.py axaliai/*.py

      - name: Run Python tests
        run: python -m unittest discover -v

      - name: Validate Vercel configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("vercel.json").read_text())
          assert config["rewrites"][0]["source"] == "/"
          assert config["rewrites"][0]["destination"] == "/web/index.html"
          print("vercel.json: valid")
          PY

  deploy:
    name: Deploy Axaliai Mainnet
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: mainnet
    concurrency:
      group: axaliai-mainnet
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not configured; automatic Render deployment is not triggered."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment hook triggered."

      - name: Deployment metadata
        run: |
          echo "service=$SERVICE"
          echo "network=$NETWORK"
          echo "commit=${GITHUB_SHA}"
