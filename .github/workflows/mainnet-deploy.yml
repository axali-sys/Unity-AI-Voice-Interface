name: Axaliai Mainnet Deploy

on:
  push:
    branches:
      - main
      - axaliai-mainnet-deployment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Axaliai
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required files
        run: |
          test -f deployment/mainnet.yaml
          test -f deployment/history.json
          test -f xparallel/server.py
          test -f web/index.html
          test -f vercel.json
          test -f .env.example

      - name: Compile Python
        run: python -m py_compile xparallel/*.py axaliai/*.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test*.py' -v

      - name: Validate Vercel routing
        run: python -c "import json; c=json.load(open('vercel.json')); assert c['rewrites'][0]['source']=='/'; assert c['rewrites'][0]['destination']=='/web/index.html'; print('Vercel routing: OK')"

      - name: Validate environment template
        run: python -c "from pathlib import Path; s=Path('.env.example').read_text(); required=['XP_TOKEN','XP_EXECUTION_APPROVAL_TOKEN','XP_HOST','XP_NETWORK','XP_VERSION']; assert all(k+'=' in s for k in required); print('Environment template: OK')"
