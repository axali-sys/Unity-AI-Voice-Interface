name: XParallel Integration Tests (DRI-001)

on:
  push:
    branches:
      - "dri-001/xparallel-master-blueprint"
  pull_request:
    paths:
      - "xparallel/**"
      - "tests/**"
      - "public/xparallel.html"
      - ".github/workflows/xparallel-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install cryptography
      - name: Compile Python sources
        run: python -m compileall -q xparallel tests
      - name: Check Axaliai and XParallel JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ("public/xparallel.html", "/tmp/xparallel-workbench.js"),
              ("public/axaliai.html", "/tmp/axaliai.js"),
              ("index.html", "/tmp/oneai.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              Path(target).write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/xparallel-workbench.js
          node --check /tmp/axaliai.js
          node --check /tmp/oneai.js
      - name: Test OneAI interface safety contract
        run: python -m unittest discover -s tests -p "test_oneai_interface.py" -v
      - name: Test memory retrieval and summarization
        run: python -m unittest discover -s tests -p "test_memory_service.py" -v
      - name: Test Parallel World planner
        run: python -m unittest discover -s tests -p "test_parallel_world.py" -v
      - name: Test persistent Axaliai conversation storage
        run: python -m unittest discover -s tests -p "test_conversation_store.py" -v
      - name: Test Digital DNA registry
        run: python -m unittest discover -s tests -p "test_digital_dna.py" -v
      - name: Test entity identity and key trust
        run: python -m unittest discover -s tests -p "test_identity_trust.py" -v
      - name: Test entity action authorization policy
        run: python -m unittest discover -s tests -p "test_entity_authorization.py" -v
      - name: Test signed entity messaging and replay protection
        run: python -m unittest discover -s tests -p "test_entity_messaging.py" -v
      - name: Test secure entity communication gateway
        run: python -m unittest discover -s tests -p "test_entity_gateway.py" -v
      - name: Test entity governance, approval separation, revocation, and expiry
        run: python -m unittest discover -s tests -p "test_entity_governance.py" -v
      - name: Test evidence-based capability verification laboratory
        run: python -m unittest discover -s tests -p "test_capability_verification.py" -v
      - name: Test verified entity action gate composition
        run: python -m unittest discover -s tests -p "test_verified_action_gate.py" -v
      - name: Test trusted host adapters and workspace enforcement boundary
        run: python -m unittest discover -s tests -p "test_trusted_host_adapters.py" -v
      - name: Test human-approved execution tickets and lifecycle
        run: python -m unittest discover -s tests -p "test_execution_approval.py" -v
      - name: Test signed execution receipts and provenance chain
        run: python -m unittest discover -s tests -p "test_execution_receipts.py" -v
      - name: Test transactional storage, migrations, backup and recovery
        run: python -m unittest discover -s tests -p "test_storage_recovery.py" -v
      - name: Test Parallel Verse SQLite persistence and workspace isolation
        run: python -m unittest discover -s tests -p "test_parallel_verse.py" -v
      - name: Test Parallel Verse authenticated service boundary
        run: python -m unittest discover -s tests -p "test_parallel_verse_service.py" -v
      - name: Test Omni workflow authorization approval retries and receipts
        run: python -m unittest discover -s tests -p "test_omni_orchestrator.py" -v
      - name: Test bounded Parallel Intelligence collaboration and verification
        run: python -m unittest discover -s tests -p "test_parallel_intelligence.py" -v
      - name: Test provider-neutral cognitive runtime and model gateway
        run: python -m unittest discover -s tests -p "test_cognitive_runtime.py" -v
      - name: Test encrypted entity memory, provenance and access controls
        run: python -m unittest discover -s tests -p "test_entity_memory.py" -v
      - name: Test signed entity federation discovery and visibility controls
        run: python -m unittest discover -s tests -p "test_entity_federation.py" -v
      - name: Test encrypted transport and reliable delivery outbox
        run: python -m unittest discover -s tests -p "test_secure_transport.py" -v
      - name: Test restricted Docker execution boundary
        run: python -m unittest discover -s tests -p "test_v1_runner.py" -v
