name: XParallel Integration Tests

on:
  pull_request:
    paths:
      - "xparallel/**"
      - "migrations/parallel_verse/**"
      - "tests/**"
      - "docs/XPARALLEL_PARALLEL_VERSE_POSTGRES.md"
      - "public/xparallel.html"
      - ".github/workflows/xparallel-tests.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xparallel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xparallel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XP_VERSE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xparallel_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q xparallel tests
      - name: Check Axaliai and XParallel JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source, target in [
              ("public/xparallel.html", "/tmp/xparallel-workbench.js"),
              ("public/axaliai.html", "/tmp/axaliai.js"),
              ("index.html", "/tmp/oneai.js"),
          ]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              Path(target).write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/xparallel-workbench.js
          node --check /tmp/axaliai.js
          node --check /tmp/oneai.js
      - name: Test OneAI interface safety contract
        run: python -m unittest discover -s tests -p "test_oneai_interface.py" -v
      - name: Test memory retrieval and summarization
        run: python -m unittest discover -s tests -p "test_memory_service.py" -v
      - name: Test Parallel World planner
        run: python -m unittest discover -s tests -p "test_parallel_world.py" -v
      - name: Test persistent Axaliai conversation storage
        run: python -m unittest discover -s tests -p "test_conversation_store.py" -v
      - name: Test chat response and workspace-scoped conversation persistence
        run: python -m unittest discover -s tests -p "test_chat_conversation_flow.py" -v
      - name: Test persistent memory vault
        run: python -m unittest discover -s tests -p "test_memory_vault.py" -v
      - name: Test Parallel Verse SQLite world store
        run: python -m unittest discover -s tests -p "test_parallel_verse.py" -v
      - name: Apply PostgreSQL test migrations
        run: |
          psql "$XP_VERSE_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/parallel_verse/0001_initial.sql
          psql "$XP_VERSE_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/parallel_verse/0002_workspace_integrity.sql
      - name: Test Parallel Verse PostgreSQL adapter against disposable PostgreSQL
        run: python -m unittest discover -s tests -p "test_parallel_verse_postgres.py" -v
