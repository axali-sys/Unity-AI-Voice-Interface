name: Build Axaliai Stream Host

on:
  workflow_dispatch:
  push:
    paths:
      - 'streaming/**'
      - 'xparallel/**'
      - '.github/workflows/build-stream-host.yml'

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --name AxaliaiStreamHost streaming/stream_host.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: axaliai-stream-host-windows
          path: dist/AxaliaiStreamHost.exe
