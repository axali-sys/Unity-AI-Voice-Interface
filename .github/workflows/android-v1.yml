name: AXALIAI Android v1

on:
  push:
    branches: ["axaliai-android-v1"]
  pull_request:
    branches: ["main", "axaliai-android-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AXALIAI Android v1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle toolchain
        run: |
          java -version
          gradle --version

      - name: Validate Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: axaliai-v1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
