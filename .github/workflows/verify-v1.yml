name: Verify Axaliai V1

on:
  push:
    branches: [main, axaliai-v1-verified-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q axaliai xparallel streaming tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
