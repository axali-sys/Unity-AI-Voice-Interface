services:
  - type: web
    name: axaliai-mainnet
    runtime: python
    buildCommand: ""
    startCommand: "python xparallel/server.py"
    healthCheckPath: /health
    envVars:
      - key: XP_TOKEN
        sync: false
      - key: XP_PUBLIC_ORIGINS
        value: "https://axaliai.com,https://www.axaliai.com"
      - key: XP_PUBLIC_RATE_LIMIT
        value: "30"
      - key: XP_PUBLIC_RATE_WINDOW
        value: "60"
      - key: XP_HOST
        value: 0.0.0.0
      - key: XP_NETWORK
        value: xparallel-mainnet
      - key: XP_VERSION
        value: 1.0.0
