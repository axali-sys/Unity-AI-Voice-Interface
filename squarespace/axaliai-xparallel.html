<!-- Axaliai front end for Squarespace. Connects only to the public XParallel API. -->
<div id="axaliai-app" style="max-width:860px;margin:0 auto;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
    <div>
      <div style="font-size:28px;font-weight:700;letter-spacing:-.03em;">AXALIAI</div>
      <div style="font-size:13px;opacity:.65;">DNA OF AI</div>
    </div>
    <div style="font-size:13px;opacity:.75;">● Omni</div>
  </div>

  <div id="axaliai-result" aria-live="polite" style="min-height:280px;padding:22px;border:1px solid rgba(0,0,0,.14);border-radius:18px;white-space:pre-wrap;overflow:auto;margin-bottom:14px;">
    How can Axaliai help?
  </div>

  <form id="axaliai-form">
    <div style="display:flex;gap:8px;align-items:flex-end;">
      <button id="axaliai-voice" type="button" aria-label="Use microphone" title="Voice" style="width:48px;height:48px;border:1px solid rgba(0,0,0,.18);border-radius:14px;background:transparent;font-size:20px;cursor:pointer;">🎙</button>
      <textarea id="axaliai-query" rows="2" required placeholder="Ask Axaliai…" style="flex:1;resize:vertical;padding:13px;border:1px solid rgba(0,0,0,.18);border-radius:14px;font:inherit;"></textarea>
      <button type="submit" style="height:48px;padding:0 20px;border:0;border-radius:14px;cursor:pointer;font-weight:650;">Send</button>
    </div>
  </form>
</div>

<script>
(() => {
  const API = "https://api.axaliai.com";
  const form = document.getElementById("axaliai-form");
  const query = document.getElementById("axaliai-query");
  const result = document.getElementById("axaliai-result");
  const voice = document.getElementById("axaliai-voice");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = query.value.trim();
    if (!text) return;
    result.textContent = "Axaliai is working…";
    try {
      const response = await fetch(`${API}/public/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      result.textContent = data.message || JSON.stringify(data, null, 2);
    } catch (error) {
      result.textContent = `Axaliai connection error: ${error.message}`;
    }
  });

  voice.addEventListener("click", () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      result.textContent = "Voice input is not supported by this browser.";
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = document.documentElement.lang || "en-US";
    recognition.interimResults = false;
    recognition.onresult = (event) => { query.value = event.results[0][0].transcript; query.focus(); };
    recognition.onerror = () => { result.textContent = "Voice input was unavailable."; };
    recognition.start();
  });
})();
</script>
